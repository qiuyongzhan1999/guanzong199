gz199:
  data-dir: D:/123/gz199/data
  # 智能择校的文字建议走 DeepSeek（chat，关闭思考，不网页搜索）。排序不依赖模型；没配 Key 时只返回分数顺序。
  deepseek:
    enabled: true
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-v4-pro
    vision-model: deepseek-flash
    timeout-seconds: 120
    max-output-tokens: 8192

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/gz199?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=8000
    username: root
    # 不要写进仓库；启动前设置环境变量（见 server/start-dev.ps1）
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
